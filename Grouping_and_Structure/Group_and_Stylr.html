<!-- for grouping we are using the <div> which help us to divide the content -->
<!-- for styling we are using <span> tag and  basic CSS -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping&Styling</title>

    <style>
        .card {
            border: 2px solid;    /*This give the border size*/
            padding: 10;          /*Padding Gives the extra space*/
            margin: 15px;        
            background-color: burlywood; /*Background color Gives the color in the background*/
        }
        
        .highlight{
            color: maroon;      /*This Colour is  appliedto the class highlight text */
            font-weight: bold;    /*font weight makes the font */
        }
    
    </style>    
</head>
<body>

    <!-- div groups related content -->
    <div class="card">
        <h2>This is HTML</h2>

        <!-- span styles a specific part of the text -->
        <p>
            I am learning <span class="highlight">HTML</span>It is amazing!
        </p>
    </div>

</body>
</html>
</html>
