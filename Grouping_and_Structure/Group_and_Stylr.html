<!-- for grouping we are using the <div> which help us to divide the content -->
<!-- for styling we are using <span> tag and  basic CSS -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping&Styling</title>

    <style>
        .card {
            border: 2px solid;
            padding: 10;
            margin: 15px;
            background-color: burlywood;
        }
        
        .highlight{
            color: maroon;
            font-weight: bold;
        }
    
    </style>    
</head>
<body>

    <!-- div groups related content -->
    <div class="card">
        <h2>This is HTML</h2>

        <!-- span styles a specific part of the text -->
        <p>
            I am learning <span class="highlight">HTML</span>It is amazing!
        </p>
    </div>

</body>
</html>
</html>
