<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semantic HTML</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>
        <p>Welcome to my site</p>

        <!-- Navigation -->
        <nav>                        <!-- Use nav tag only to major navigation  -->
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Courses</a>
            <a href="#">Login</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>  <!-- use only one <main> tag per web -->

        <!-- Welcome Section -->
        <section> <!-- Use section Only when needed -->
            <h2>Welcome</h2>
            <p>This is my page content.</p>
        </section>


        <!-- About Section -->
        <section>
            <h2>About Me</h2>
            <p>I enjoy web development.</p>
        </section>


        <!-- Blog Article -->
        <article>                             <!-- Use Article to show related topic -->
            <h2>My First Blog Post</h2>
            <p>This is my article text.</p>
        </article>


        <!-- Related Articles -->
        <aside>
            <h3>Related Articles</h3>

            <ul>
                <li><a href="#">News 1</a></li>
                <li><a href="#">News 2</a></li>
                <li><a href="#">News 3</a></li>
                <li><a href="#">News 4</a></li>
                <li><a href="#">News 5</a></li>
                <li><a href="#">News 6</a></li>
            </ul>
        </aside>

    </main>


    <!-- Footer -->
    <footer>
        <p> @copyrightXYZ</p>
        <p>Contact: <a href="mailto:abc@gmail.com">abc@gmail.com</a></p>
    </footer>

</body>

</html>
